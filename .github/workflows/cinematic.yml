name: Cinematic asset verification
on:
  push:
    branches: [main]
    paths: ['index.html','cinematic.mjs','scripts/prepare_assets.py','tests/cinematic_webgl.py','.github/workflows/cinematic.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  assets-and-render:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node --check cinematic.mjs
      - run: python scripts/prepare_assets.py
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: python tests/cinematic_webgl.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cinematic-assets
          path: assets/
          if-no-files-found: warn
