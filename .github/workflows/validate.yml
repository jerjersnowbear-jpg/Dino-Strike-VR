name: Validate Dino Strike VR
on: [push, pull_request]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -c "from pathlib import Path; Path('/tmp/dino-check.js').write_text(Path('index.html').read_text().split('<script>')[-1].split('</script>')[0])"
          node --check /tmp/dino-check.js
          node --check sw.js
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: python tests/smoke.py
